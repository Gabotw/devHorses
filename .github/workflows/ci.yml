name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GymFlow.slnx

      - name: Build
        run: dotnet build GymFlow.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GymFlow.slnx --configuration Release --no-build --verbosity normal
